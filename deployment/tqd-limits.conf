# /etc/nginx/conf.d/tqd-limits.conf
# Rate limiting zones — included globally in nginx http{} context.
# api_limit:     10 req/s per IP for /api/ routes
# general_limit: 30 req/s per IP for all other traffic

limit_req_zone $binary_remote_addr zone=api_limit:10m     rate=10r/s;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

# Return JSON for rate limit errors
limit_req_log_level warn;
