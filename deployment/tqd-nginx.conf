## Rate limiting zones (defined in http context — these directives are picked up
## by nginx when this file is included under /etc/nginx/sites-enabled/)
## NOTE: limit_req_zone must be in nginx.conf http{} block, not here.
## We define them in /etc/nginx/conf.d/tqd-limits.conf (uploaded separately).

server {
    listen 80;
    listen [::]:80;
    server_name demoview.space www.demoview.space 194.163.135.177 _;

    # Redirect all HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name demoview.space www.demoview.space;

    access_log /var/log/nginx/tqd-website_access.log;
    error_log /var/log/nginx/tqd-website_error.log;

    # SSL managed by certbot
    # ssl_certificate / ssl_certificate_key lines injected by certbot

    # ── TLS hardening ────────────────────────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header Strict-Transport-Security   "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options             "SAMEORIGIN" always;
    add_header X-Content-Type-Options      "nosniff" always;
    add_header X-XSS-Protection            "1; mode=block" always;
    add_header Referrer-Policy             "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy          "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy     "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;

    # Hide nginx version
    server_tokens off;

    # ── Request limits ───────────────────────────────────────────────────────
    client_max_body_size 1m;
    client_body_timeout  10s;
    client_header_timeout 10s;

    # ── Block hidden files / sensitive paths ─────────────────────────────────
    location ~ /\.(env|git|htaccess|htpasswd|DS_Store) {
        deny all;
        return 404;
    }

    # ── Health check (no logging, no rate limit) ─────────────────────────────
    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ── API rate limiting (stricter) ─────────────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_hide_header X-Powered-By;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ── General traffic ──────────────────────────────────────────────────────
    location / {
        limit_req zone=general_limit burst=50 nodelay;
        limit_req_status 429;

        proxy_hide_header X-Powered-By;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 30s;
    }
}
