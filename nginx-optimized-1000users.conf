user nginx;

# Auto-detect number of CPU cores
worker_processes auto;

# Max file descriptors per process
worker_rlimit_nofile 65535;

# Event handling
events {
    # Max concurrent connections per worker
    worker_connections 10000;
    
    # Efficient connection processing on Linux
    use epoll;
    
    # Accept multiple connections at once
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main buffer=32k flush=5s;
    error_log /var/log/nginx/error.log warn;

    # Performance tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    
    # Connection timeouts
    keepalive_timeout 65;
    keepalive_requests 100;
    client_header_timeout 20s;
    client_body_timeout 20s;
    send_timeout 20s;
    
    # Buffer sizes
    client_body_buffer_size 128k;
    client_max_body_size 10m;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;
    
    # Hash tables
    types_hash_max_size 2048;
    server_names_hash_bucket_size 64;
    
    # Gzip compression (reduce bandwidth)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";

    # Response caching
    proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:100m 
                     max_size=2g inactive=60m use_temp_path=off loader_files=100;
    proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static_cache:50m 
                     max_size=1g inactive=30d use_temp_path=off;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=contact:10m rate=2r/s;

    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Upstream configuration with load balancing
    upstream nextjs_backend {
        # Least connections load balancing (best for long-lived connections)
        least_conn;
        
        # Multiple Node.js workers
        server localhost:3001 max_fails=2 fail_timeout=30s weight=1;
        server localhost:3002 max_fails=2 fail_timeout=30s weight=1;
        server localhost:3003 max_fails=2 fail_timeout=30s weight=1;
        server localhost:3004 max_fails=2 fail_timeout=30s weight=1;
        
        # Connection pooling
        keepalive 64;
        keepalive_requests 100;
        keepalive_timeout 60s;
    }

    # HTTP → HTTPS redirect
    server {
        listen 80;
        listen [::]:80;
        server_name demoview.space www.demoview.space _;
        
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Main HTTPS server
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name demoview.space www.demoview.space;

        # SSL Configuration
        ssl_certificate /etc/letsencrypt/live/demoview.space/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/demoview.space/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/demoview.space/chain.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5:!RSA;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:50m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # HSTS
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # Logging
        access_log /var/log/nginx/nextjs_access.log main;
        error_log /var/log/nginx/nextjs_error.log warn;

        # ========== STATIC FILES ==========
        location ~* ^/(_next|public)/ {
            proxy_cache static_cache;
            proxy_cache_valid 200 30d;
            proxy_cache_bypass $http_pragma $http_authorization;
            
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header X-Cache-Status $upstream_cache_status;
            
            access_log off;
        }

        # Images with moderate caching
        location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
            expires 7d;
            add_header Cache-Control "public";
            access_log off;
        }

        # ========== API ENDPOINTS ==========
        location /api/ {
            limit_req zone=api burst=30 nodelay;
            limit_conn conn_limit 50;

            # Cache GET requests only
            proxy_cache api_cache;
            proxy_cache_methods GET HEAD;
            proxy_cache_valid 200 60s;
            proxy_cache_valid 404 10s;
            proxy_cache_key "$scheme$request_method$host$request_uri$http_authorization";
            proxy_cache_bypass $http_cache_control;
            add_header X-Cache-Status $upstream_cache_status;

            proxy_pass http://nextjs_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }

        # ========== CONTACT FORM ==========
        location /api/contact {
            limit_req zone=contact burst=5 nodelay;
            limit_conn conn_limit 10;

            proxy_pass http://nextjs_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Don't cache form submissions
            proxy_no_cache 1;
            proxy_cache_bypass 1;
        }

        # ========== EVERYTHING ELSE ==========
        location / {
            limit_req zone=general burst=20 nodelay;
            limit_conn conn_limit 50;

            proxy_pass http://nextjs_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Streaming support
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # ========== HEALTH CHECK ==========
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
