version: '3.8'

services:
  # Next.js Application
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tqd-app
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://demoview.space}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://demoview.space/api}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_TO: ${MAIL_TO}
    ports:
      - "3000:3000"
    volumes:
      - ./public:/app/public
      - ./node_modules:/app/node_modules
    networks:
      - tqd-network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: tqd-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./public:/usr/share/nginx/html/public:ro
      - /etc/letsencrypt:/etc/nginx/ssl:ro
    depends_on:
      - nextjs
    networks:
      - tqd-network
    restart: unless-stopped

networks:
  tqd-network:
    driver: bridge
